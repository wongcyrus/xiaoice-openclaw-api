services:
  xiaoice-openclaw-bridge:
    build: .
    container_name: xiaoice-openclaw-bridge
    network_mode: "host"
    environment:
      - PORT=${PORT:-3002}
      - XIAOICE_ACCESS_KEY=${XIAOICE_ACCESS_KEY:-test_access_key}
      - XIAOICE_SECRET_KEY=${XIAOICE_SECRET_KEY:-test_secret_key}
      
      # In host network mode, 127.0.0.1 refers directly to the host machine loopback where OpenClaw lives
      - OPENCLAW_WS_URL=${OPENCLAW_WS_URL:-ws://127.0.0.1:18789}
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN}
      - OPENCLAW_AGENT_ID=${OPENCLAW_AGENT_ID:-main}
    volumes:
      - ./session_config.json:/app/session_config.json
    restart: unless-stopped
